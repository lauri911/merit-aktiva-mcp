[project]
name = "merit-aktiva-mcp"
version = "0.1.1"
description = "Unofficial MCP server for Merit Aktiva bookkeeping (Estonia): every API endpoint as tools for Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28",
    "pillow>=11",
    "pypdf>=5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
merit-aktiva-mcp = "merit_aktiva_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merit_aktiva_mcp"]
